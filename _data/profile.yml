short_bio: >-
  <p>
    Hello, I am Huijie Sun. Welcome to my homepage. I am currently a Ph.D. student
    in Business Administration at the School of Management, University of Science
    and Technology of China (USTC). I am fortunate to be supervised by Prof. Zhiying
    Liu and Assistant Prof. Tianyu Hou. My research interests focus on innovation,
    digital transformation, and AI diffusion. Please feel free to contact me for
    academic exchange or potential collaboration. You can also find my publications
    on <a href="https://au.cnki.net/author/personalInfo/000075386672" target="_blank"
    rel="noopener noreferrer">CNKI</a>.
  </p>

