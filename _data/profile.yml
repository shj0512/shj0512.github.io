short_bio: >-
  <p>
    Hello, I am Huijie Sun. Welcome to my homepage. I am currently a Ph.D. student
    in Business Administration at the School of Management, University of Science
    and Technology of China (USTC). I am fortunate to be supervised by
    <a href="https://bs.ustc.edu.cn/Chinese/profile-37.html" target="_blank" rel="noopener noreferrer">Prof. Zhiying Liu</a>
    and <a href="https://bs.ustc.edu.cn/chinese/profile-2444.html" target="_blank" rel="noopener noreferrer">Assistant Prof. Tianyu Hou</a>.
    My research interests focus on innovation,
    digital transformation, and AI diffusion. Please feel free to contact me for
    academic exchange or potential collaboration.
  </p>

